<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <title>Mob Atidol – Mobilier la comandă</title>
    <script>
      // GitHub Pages SPA redirect: store the path in sessionStorage and redirect to home
      var l = window.location;
      var path = l.pathname.slice(1);
      var query = l.search.slice(1);
      var hash = l.hash.slice(1);
      sessionStorage.setItem(
        'ghpages-redirect',
        JSON.stringify({ path: path, query: query, hash: hash })
      );
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/');
    </script>
  </head>
  <body>
    <p>Redirecționare…</p>
  </body>
</html>
