<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <title>Mob Atidol – Mobilier la comandă</title>
    <script>
      // GitHub Pages SPA redirect for HashRouter:
      // Converts direct path requests into hash routes, seamlessly supporting:
      // - Custom domain:     https://mobatidor.ro/produse            -> https://mobatidor.ro/#/produse
      // - Project subdomain: https://bogdanctu.github.io/AttilaMobDesign/produse -> https://bogdanctu.github.io/AttilaMobDesign/#/produse
      (function() {
        var l = window.location;
        var pathname = l.pathname;
        var repo = '/AttilaMobDesign';
        var base = pathname.startsWith(repo) ? repo + '/' : '/';
        var route = pathname.startsWith(repo) ? pathname.slice(repo.length) : pathname;
        if (route.startsWith('/')) route = route.slice(1);
        var target = l.protocol + '//' + l.host + base + (route ? '#/' + route : '') + l.search + l.hash;
        l.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Redirecționare…</p>
  </body>
</html>
